# Native options only: tmux and psmux apply the theme synchronously.

set -g status on
set -g status-style 'fg=#31748f,bg=#191724'
set -g status-left-length 200
set -g status-right-length 200

# Session icon changes to love while the prefix is active; the clock stays live.
set -g status-left '#[fg=#{?client_prefix,#eb6f92,#e0def4}] #[fg=#e0def4]#S  '
set -g status-right '#[fg=#9ccfd8]%H:%M#[fg=#908caa]  󰃰 #[fg=#e0def4]  '

setw -g window-status-style 'fg=#c4a7e7,bg=#191724'
setw -g window-status-current-style 'fg=#f6c177,bg=#191724'
setw -g window-status-activity-style 'fg=#191724,bg=#ebbcba'
setw -g window-status-format '#I #W'
setw -g window-status-current-format '#I #W'
setw -g window-status-separator ' | '

set -g pane-border-style 'fg=#524f67'
set -g pane-active-border-style 'fg=#f6c177'
set -g display-panes-active-colour '#e0def4'
set -g display-panes-colour '#f6c177'
set -g message-style 'fg=#6e6a86,bg=#191724,fill=#191724'
set -g message-command-style 'fg=#191724,bg=#f6c177,fill=#f6c177'
setw -g clock-mode-colour '#eb6f92'
setw -g mode-style 'bg=#403d52'
